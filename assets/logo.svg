<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081812"/>
      <stop offset="100%" stop-color="#0f2b20"/>
    </linearGradient>
    <linearGradient id="ecoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="carbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#06d6a0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Badge -->
  <rect width="500" height="500" rx="100" fill="url(#bgGrad)"/>
  <rect width="492" height="492" x="4" y="4" rx="96" fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Global Carbon Atmosphere Circulation Arc -->
  <circle cx="250" cy="250" r="170" fill="none" stroke="#00f5d4" stroke-width="2" stroke-dasharray="8 12" stroke-opacity="0.3"/>
  <circle cx="250" cy="250" r="125" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Ecological Leaf Silhouette (Left Half of Emblem) -->
  <path d="M 250 110 C 160 110 120 200 120 280 C 120 360 190 390 250 390 Z" fill="#143c2d" stroke="url(#ecoGrad)" stroke-width="5" filter="url(#glow)"/>

  <!-- Carbon Molecule Lattice / Digital Ledger Grid (Right Half) -->
  <path d="M 250 110 C 340 110 380 200 380 280 C 380 360 310 390 250 390 Z" fill="#102d23" stroke="url(#carbonGrad)" stroke-width="4" stroke-dasharray="6 6" filter="url(#glow)"/>

  <!-- Central Leaf Vein / Carbon Emission Divider -->
  <line x1="250" y1="110" x2="250" y2="390" stroke="#00f5d4" stroke-width="4" stroke-linecap="round"/>

  <!-- Molecular Carbon Hexagon Nodes (CO2e Audit Tokens) -->
  <circle cx="310" cy="210" r="10" fill="#ffd166" filter="url(#glow)"/>
  <circle cx="340" cy="270" r="8" fill="#00f5d4" filter="url(#glow)"/>
  <circle cx="295" cy="320" r="9" fill="#10b981" filter="url(#glow)"/>

  <line x1="250" y1="210" x2="310" y2="210" stroke="#ffd166" stroke-width="2"/>
  <line x1="310" y1="210" x2="340" y2="270" stroke="#00f5d4" stroke-width="2"/>
  <line x1="340" y1="270" x2="295" y2="320" stroke="#10b981" stroke-width="2"/>
  <line x1="295" y1="320" x2="250" y2="320" stroke="#10b981" stroke-width="2"/>

  <!-- Zero-Knowledge Shield Checkmark -->
  <circle cx="190" cy="270" r="22" fill="#0b241b" stroke="#00f5d4" stroke-width="3"/>
  <path d="M 180 270 L 187 277 L 202 262" fill="none" stroke="#00f5d4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
